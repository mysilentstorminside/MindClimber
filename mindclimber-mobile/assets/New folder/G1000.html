<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>G1000</title>
    <style>
        .pattern {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin: 20px 0;
        }
        .shape {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }
    </style>
</head>
<body>
    <div id="question">
        <h2>What comes next in this pattern?</h2>
        <div class="pattern">
            <div class="shape" style="background:red;color:white;">🔴</div>
            <div class="shape" style="background:red;color:white;">🔴</div>
            <div class="shape" style="background:red;color:white;">🔴</div>
            <div class="shape" style="background:red;color:white;">🔴</div>
            <div class="shape" style="background:red;color:white;">🔴</div>
            <div class="shape">?</div>
        </div>
    </div>
    
    <div id="options">
        <div data-correct="false" data-value="A">
            <div class="shape" style="background:green;color:white;">🟢</div>
            <p>Option A</p>
        </div>
        <div data-correct="false" data-value="B">
            <div class="shape" style="background:blue;color:white;">🔵</div>
            <p>Option B</p>
        </div>
        <div data-correct="true" data-value="C">
            <div class="shape" style="background:red;color:white;">🔴</div>
            <p>Option C</p>
        </div>
    </div>
</body>
</html>
